<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon.png" type="image/png">
    <title>Light&Lens - Gallery Name</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
</head>

<body oncontextmenu="return false;">
    <header class="header">
        <div class="container">
            <h1 class="logo">
                <a href="index.html" class="logo-link">Light & Lens</a>
            </h1>
            <nav class="nav">
                <button class="nav-toggle" id="navToggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul class="nav-menu" id="navMenu">
                    <li><a href="index.html" class="nav-link" data-i18n="navHome">Home</a></li>
                    <li><a href="index.html#gallery" class="nav-link" data-i18n="navGallery">Gallery</a></li>
                    <li><a href="index.html#map" class="nav-link" data-i18n="navMap">Map</a></li>
                    <li><a href="index.html#contact" class="nav-link" data-i18n="navContact">Contact</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <div class="lang-switch" role="group" aria-label="Language">
                    <button type="button" class="lang-btn active" data-lang="en">EN</button>
                    <button type="button" class="lang-btn" data-lang="zh">中文</button>
                </div>
            </div>
        </div>
    </header>

    <main class="gallery-page">
        <div class="container">
            <!-- Gallery Header -->
            <div class="gallery-header">
                <div class="gallery-info">
                    <h1 id="galleryTitle" class="gallery-title"></h1>
                    <div class="gallery-meta">
                        <span class="meta-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <span id="galleryLocation"></span>
                        </span>
                        <span class="meta-item">
                            <i class="fas fa-calendar"></i>
                            <span id="galleryYear"></span>
                        </span>
                        <span class="meta-item">
                            <i class="fas fa-images"></i>
                            <span id="photoCount"></span> <span data-i18n="photosWord">photos</span>
                        </span>
                    </div>
                    <p id="galleryDescription" class="gallery-description"></p>
                </div>
                <div class="gallery-actions">
                    <a href="index.html#gallery" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i>
                        <span data-i18n="backHome">Back to Home</span>
                    </a>
                </div>
            </div>

            <!-- Panorama Section -->
            <div class="panorama-section" id="panoramaSection" style="display: none;">
                <div class="panorama-container" id="panoramaContainer">
                    <!-- Pannellum viewer will be initialized here -->
                </div>
            </div>
            
            <!-- Photos Grid -->
            <div class="photos-grid" id="photosGrid">
                <!-- Photos will be dynamically loaded here -->
            </div>
        </div>
    </main>

    <!-- Full-screen Photo Viewer -->
    <div id="fullscreenViewer" class="fullscreen-viewer">
        <div class="fullscreen-content">
            <div class="fullscreen-image-container">
                <img id="fullscreenImage" src="" alt="" loading="lazy">
            </div>
            
            <!-- Navigation Controls -->
            <button id="prevPhotoBtn" class="fullscreen-nav-btn prev-btn">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button id="nextPhotoBtn" class="fullscreen-nav-btn next-btn">
                <i class="fas fa-chevron-right"></i>
            </button>
            
            <!-- Close Button -->
            <button id="closeViewerBtn" class="fullscreen-close-btn">
                <i class="fas fa-times"></i>
            </button>
            
            <!-- Photo Counter -->
            <div class="fullscreen-counter">
                <span id="currentPhotoIndex">1</span> / <span id="totalPhotos">1</span>
            </div>
            
            <!-- Fullscreen Star Rating (disabled — keep for possible restore)
            <div class="fullscreen-rating">
                <div class="star-rating" id="fullscreenStarRating">
                </div>
            </div>
            -->
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p data-i18n="footer">&copy; 2025 Light&Lens. All rights reserved.</p>
        </div>
    </footer>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/gallery-script.js"></script>
</body>
</html>
